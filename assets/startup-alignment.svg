<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc"><title id="title">GPS 이동벡터를 이용한 초기 방향 정렬</title><desc id="desc">GPS 시작점과 이동 후 위치로 방향을 구하고, EKF yaw 오프셋을 경로 계산과 시각화에 적용하는 과정.</desc><rect x="0" y="0" width="1600" height="960" rx="0" fill="#F4F6F8" opacity="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#B5E57E" opacity="1"/><text x="72" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="17" fill="#101C2D" font-weight="700" letter-spacing="2" text-anchor="start">03  /  SYSTEM OVERVIEW</text><text x="1528" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="1" text-anchor="end">STARTUP HEADING ALIGNMENT</text><text x="68" y="135" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="45" fill="#101C2D" font-weight="700" letter-spacing="-1" text-anchor="start">실제 이동 방향으로 출발 기준 정렬</text><text x="72" y="182" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">GPS 이동벡터와 EKF yaw의 차이를 초기 오프셋으로 적용</text><line x1="72" y1="212" x2="1528" y2="212" stroke="#D9E0E7" stroke-width="1" opacity="1"/><rect x="72" y="258" width="270" height="177" rx="14" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="92" y="278" width="37" height="31" rx="7" fill="#B5E57E" opacity="1"/><text x="110" y="300" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">01</text><text x="92" y="344" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">입력 준비</text><text x="92" y="378" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">GPS 위치와</text><text x="92" y="406" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">경로 수신</text><line x1="342" y1="345" x2="361" y2="345" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 354 339 L 362 345 L 354 351" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="368" y="258" width="270" height="177" rx="14" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="388" y="278" width="37" height="31" rx="7" fill="#B5E57E" opacity="1"/><text x="406" y="300" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">02</text><text x="388" y="344" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">시작점 저장</text><text x="388" y="378" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">첫 위치 P₀를</text><text x="388" y="406" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">한 번 저장</text><line x1="638" y1="345" x2="657" y2="345" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 650 339 L 658 345 L 650 351" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="664" y="258" width="270" height="177" rx="14" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="684" y="278" width="37" height="31" rx="7" fill="#B5E57E" opacity="1"/><text x="702" y="300" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">03</text><text x="684" y="344" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">직선 이동</text><text x="684" y="378" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">GPS 직선 변위</text><text x="684" y="406" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">1 m 이상</text><line x1="934" y1="345" x2="953" y2="345" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 946 339 L 954 345 L 946 351" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="960" y="258" width="270" height="177" rx="14" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="980" y="278" width="37" height="31" rx="7" fill="#B5E57E" opacity="1"/><text x="998" y="300" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">04</text><text x="980" y="344" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">오프셋 계산</text><text x="980" y="378" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">이동 방향과</text><text x="980" y="406" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">EKF yaw의 차이</text><line x1="1230" y1="345" x2="1249" y2="345" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1242 339 L 1250 345 L 1242 351" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="1256" y="258" width="270" height="177" rx="14" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="1276" y="278" width="37" height="31" rx="7" fill="#B5E57E" opacity="1"/><text x="1294" y="300" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">05</text><text x="1276" y="344" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">경로 추종</text><text x="1276" y="378" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">현재 EKF yaw에</text><text x="1276" y="406" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">고정 오프셋 적용</text><rect x="72" y="476" width="643" height="367" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><text x="100" y="519" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">시작점과 이동 후 위치</text><line x1="156" y1="757" x2="622" y2="757" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 612 750 L 622 757 L 612 764" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="156" y1="757" x2="156" y2="565" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 149 575 L 156 565 L 163 575" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M 156 757 L 555 586" fill="none" stroke="#368A75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M 541 585 L 555 586 L 547 599" fill="none" stroke="#368A75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><circle cx="156" cy="757" r="9" fill="#101C2D" opacity="1"/><circle cx="555" cy="586" r="10" fill="#368A75" opacity="1"/><text x="126" y="799" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#101C2D" font-weight="600" letter-spacing="0" text-anchor="start">P₀ 시작점</text><text x="477" y="561" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="20" fill="#101C2D" font-weight="600" letter-spacing="0" text-anchor="start">P₁ 현재 위치</text><text x="586" y="796" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="18" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">+x</text><text x="111" y="566" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="18" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">+y</text><text x="235" y="612" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="21" fill="#368A75" font-weight="600" letter-spacing="0" text-anchor="start">GPS 변위 ≥ 1 m</text><rect x="747" y="476" width="781" height="367" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><text x="779" y="519" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">보정값 계산과 적용</text><text x="779" y="576" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="24" fill="#101C2D" font-weight="500" letter-spacing="0" text-anchor="start">이동 방향 = atan2(Δy, Δx)</text><text x="779" y="622" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#101C2D" font-weight="500" letter-spacing="0" text-anchor="start">yaw 오프셋 = 이동 방향 − 보정 시점의 EKF yaw</text><rect x="777" y="655" width="721" height="70" rx="10" fill="#EEF6E6" opacity="1"/><text x="799" y="698" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="23" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">보정 yaw = 현재 EKF yaw + 고정 오프셋</text><text x="779" y="777" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="21" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">보정 방향을 경로 계산과 시각화에 함께 사용</text><line x1="72" y1="877" x2="1528" y2="877" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="72" y="917" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">GPS DISPLACEMENT  →  HEADING OFFSET  →  LOCAL PATH</text><text x="1528" y="917" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="15" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="end">HL FMA 2025</text></svg>