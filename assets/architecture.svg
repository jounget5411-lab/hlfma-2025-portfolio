ic','Segoe UI',Arial,sans-serif" font-size="18" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">검출 결과를 신호 상태로 변환해 ROS 토픽으로 전달합니다.</text><text x="297" y="1083" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="18" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">인식·판단·통신을 분리해 각 단계의 데이터를 관찰합니다.</text><line x1="72" y1="1177" x2="1528" y2="1177" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="72" y="1217" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">SYSTEM ARCHITECTURE  ·  위치·방향·목표 경로에서 조향과 구동까지</text><text x="1528" y="1217" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="15" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="end">METHOD  전방 목표 방향 기반 단계형 조향</text></svg>