<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-labelledby="title desc"><title id="title">GNSS와 경로 기반 주행 제어 구조</title><desc id="desc">GNSS 위치, IMU와 주행계 기반 EKF 방향, 전역 CSV 경로가 로컬 목표를 만들고 단계형 조향과 직렬 통신 명령으로 이어집니다. LiDAR 정지와 카메라 신호 관측은 별도 경로입니다.</desc><rect x="0" y="0" width="1600" height="1260" rx="0" fill="#F4F6F8" opacity="1"/><rect x="0" y="0" width="1600" height="12" rx="0" fill="#B5E57E" opacity="1"/><text x="72" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="17" fill="#101C2D" font-weight="700" letter-spacing="2" text-anchor="start">03  /  SYSTEM OVERVIEW</text><text x="1528" y="67" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="1" text-anchor="end">GNSS / IMU / PATH / CONTROL</text><text x="68" y="135" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="45" fill="#101C2D" font-weight="700" letter-spacing="-1" text-anchor="start">위치와 방향을 맞추고, 전방 목표를 따라가다</text><text x="72" y="182" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="22" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">HL FMA 2025 · 위치 추정과 경로 추종, 차량 제어</text><line x1="72" y1="212" x2="1528" y2="212" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="72" y="257" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="700" letter-spacing="1.5" text-anchor="start">01</text><text x="116" y="257" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="23" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">주행 계획과 제어</text><rect x="72" y="287" width="340" height="300" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="94" y="308" width="38" height="30" rx="7" fill="#B5E57E" opacity="1"/><text x="113" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">01</text><text x="94" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">위치·방향</text><text x="94" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">LOCALIZATION</text><line x1="94" y1="428" x2="390" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="94" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">GNSS → GPS 위치</text><text x="94" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">IMU + 주행계 → EKF</text><text x="94" y="523" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">이동 기반 yaw 오프셋 보정</text><rect x="444" y="287" width="340" height="300" rx="16" fill="#FFFFFF" opacity="1" stroke="#D9E0E7" stroke-width="1"/><rect x="466" y="308" width="38" height="30" rx="7" fill="#B5E57E" opacity="1"/><text x="485" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">02</text><text x="466" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">전역 기준 경로</text><text x="466" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">WAYPOINT CSV</text><line x1="466" y1="428" x2="762" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="466" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans