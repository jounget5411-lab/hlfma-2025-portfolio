38" height="30" rx="7" fill="#B5E57E" opacity="1"/><text x="1229" y="330" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="middle">04</text><text x="1210" y="379" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="27" fill="#101C2D" font-weight="700" letter-spacing="0" text-anchor="start">주행 명령</text><text x="1210" y="408" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="16" fill="#637487" font-weight="500" letter-spacing="0" text-anchor="start">motion_planner</text><line x1="1210" y1="428" x2="1506" y2="428" stroke="#D9E0E7" stroke-width="1" opacity="1"/><text x="1210" y="463" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">목표 방향: atan2</text><text x="1210" y="493" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">단계형 조향: ±1…5</text><text x="1210" y="523" font-family="'Malgun Gothic','Segoe UI',Arial,sans-serif" font-size="19" fill="#637487" font-weight="400" letter-spacing="0" text-anchor="start">조향·구동 명령 생성</text><line x1="784" y1="438" x2="809" y2="438" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 802 432 L 810 438 L 802 444" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="1156" y1="438" x2="1181" y2="438" stroke="#637487" stroke-width="2" opacity="1"/><path d="M 1174 432 L 1182 438 L 1174 444" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M 242 587 V 617 H 986 V 591" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M 980 598 L 986 590 L 992 598" fill="none" stroke="#637487" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"